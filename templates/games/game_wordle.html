{% extends "base.html" %}

{% block title %}FootWordle - FootMind{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/game_wordle.css') }}">
{% endblock %}

{% block content %}
<div class="game-container" 
     id="gameWordleContainer"
     data-word-length="{{ word_length }}"
     data-guess-url="{{ url_for('game_wordle.check_guess') }}">
    <a href="{{ url_for('index') }}" class="back-link">← Voltar para Início</a>
    
    <div class="game-header">
        <h1>⚽ FootWordle</h1>
        <p class="subtitle">Adivinhe o jogador de futebol em até 5 tentativas!</p>
    </div>

    <div id="message">Você tem 5 tentativas!</div>
    
    <div class="game-board" id="gameBoard"></div>
    
    <div class="game-input-container">
        <input 
            type="text" 
            id="guessInput" 
            placeholder="Digite o nome do jogador"
            maxlength="{{ word_length }}"
            autocomplete="off"
        >
        <button class="btn-guess" onclick="makeGuess()" id="guessButton">
            Tentar
        </button>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/game_wordle.js') }}"></script>
<script>
    // Inicializa o jogo quando o DOM estiver pronto
    document.addEventListener('DOMContentLoaded', function() {
        const container = document.getElementById('gameWordleContainer');
        if (!container) return;
        
        const wordLength = parseInt(container.getAttribute('data-word-length'), 10);
        const guessUrl = container.getAttribute('data-guess-url');
        
        if (typeof initializeGameWordle === 'function') {
            initializeGameWordle(wordLength, guessUrl);
        }
    });
</script>
{% endblock %}
