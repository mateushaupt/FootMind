<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FootMind - Jogos de Adivinhação de Futebol{% endblock %}</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Header/Navigation -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <a href="{{ url_for('index') }}">
                        <h1>⚽ FootMind</h1>
                    </a>
                </div>
                
                <nav class="nav-menu" id="nav-menu">
                    <a href="{{ url_for('index') }}" class="nav-link">Início</a>
                    <a href="#" class="nav-link" id="history-link">Histórico</a>
                    <a href="{{ url_for('auth.login') }}" class="nav-link" id="login-link">Entrar</a>
                    <a href="{{ url_for('auth.register') }}" class="nav-link" id="register-link">Registrar</a>
                </nav>
                
                <!-- User Menu (visível quando logado) -->
                <div class="user-menu" id="user-menu" style="display: none;">
                    <span class="user-name" id="user-name">Usuário</span>
                    <a href="#" class="nav-link" id="logout-link">Sair</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 FootMind. Desafie seu conhecimento sobre futebol!</p>
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
